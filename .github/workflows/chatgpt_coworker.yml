name: ChatGPT Coworker Analysis Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'web/public/llm_analysis.md'
      - 'docs/chatgpt_coworker_morning_prompt.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-chatgpt-coworker-analysis:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: ./web
        run: npm ci

      - name: Run web tests
        working-directory: ./web
        run: npm test

      - name: Build static site
        working-directory: ./web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
