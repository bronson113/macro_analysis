name: Daily Macro Analysis

on:
  schedule:
    # 9:00 AM UTC translates to 5:00 AM EDT (or 4:00 AM EST)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  run-macro-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push data and reports back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run macro analysis pipeline
        run: python main.py run

      - name: Commit and push state changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated daily macro data update and report"
          file_pattern: "data/macro_data.db output/*.md"
