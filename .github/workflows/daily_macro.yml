name: Daily Macro Analysis & Deploy

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'web/public/llm_analysis.md'
      - 'docs/chatgpt_coworker_morning_prompt.md'
  workflow_dispatch:
  schedule:
    # Run once at a fixed UTC time. This is 2:30 AM PST / 3:30 AM PDT.
    - cron: '30 10 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-macro-analysis-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Pre-fetch FRED Data via Akamai Cookie Handshake
        run: python prefetch_fred.py

      - name: Run macro analysis pipeline
        run: python main.py run

      - name: Validate fresh macro gate data
        run: python validate_fresh_macro_data.py

      - name: Update Web Data
        run: bash update_web_data.sh

      - name: Install Node dependencies
        working-directory: ./web
        run: npm ci

      - name: Run web tests
        working-directory: ./web
        run: npm test

      - name: Build static site
        working-directory: ./web
        run: npm run build

      - name: Commit and push validated data state
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "Automated daily macro data update"
          file_pattern: "data/*.csv output/*.md output/*.json web/public/*"

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: './web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
